name: Teste ponta a ponta

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    name: Ecossistema completo (Core + Plataforma + Mesa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar os servicos
        run: |
          (cd fiap-bank-core-bancario && mvn -B -ntp -q install -DskipTests)
          (cd fiap-bank-plataforma-credito && mvn -B -ntp -q install -DskipTests)
          (cd fiap-bank-mesa-operacoes-credito && mvn -B -ntp -q package -DskipTests)

      - name: Subir os servicos (8080, 8081, 8082)
        shell: bash
        run: |
          esperar() { for i in $(seq 1 90); do curl -sf -o /dev/null "$1" && return 0; sleep 2; done; echo "Timeout aguardando $1"; return 1; }
          nohup java -jar fiap-bank-core-bancario/fiap-bank-core-bancario-presentation/target/fiap-bank-core-bancario-presentation-1.0.0-SNAPSHOT.jar > core.log 2>&1 &
          esperar http://localhost:8080/api/v1/clientes
          nohup java -jar fiap-bank-plataforma-credito/fiap-bank-plataforma-credito-presentation/target/fiap-bank-plataforma-credito-presentation-1.0.0-SNAPSHOT.jar > plataforma.log 2>&1 &
          esperar http://localhost:8081/actuator/health
          nohup java -jar fiap-bank-mesa-operacoes-credito/target/fiap-bank-mesa-operacoes-credito-1.0.0-SNAPSHOT.jar > mesa.log 2>&1 &
          esperar http://localhost:8082/dashboard

      - name: Executar smoke test
        shell: bash
        run: |
          set -o pipefail
          bash scripts/e2e-smoke-test.sh | tee e2e.log

      - name: Publicar resultado
        if: always()
        shell: bash
        run: |
          publicar() { # nivel titulo arquivo linhas_por_bloco max_blocos
            [ -s "$3" ] || return 0
            split -l "$4" "$3" bloco_
            n=0
            for f in bloco_*; do
              n=$((n + 1)); [ "$n" -le "$5" ] || break
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::$1 title=$2::${msg}"
            done
            rm -f bloco_*
          }
          [ -f e2e.log ] && grep -E "^(PASS|FAIL|RESULTADO)" e2e.log > resumo.txt && publicar notice "E2E" resumo.txt 30 8
          [ -f e2e.log ] && grep -E "^FAIL" e2e.log > falhas.txt && publicar error "E2E falhas" falhas.txt 15 4
          for app in core plataforma mesa; do
            [ -f $app.log ] || continue
            grep -E "ERROR|Caused by|APPLICATION FAILED|Exception:" $app.log | head -40 > $app-erros.txt || true
            publicar warning "Log $app" $app-erros.txt 20 2
          done
