server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fiap-bank-plataforma-credito
  datasource:
    url: jdbc:h2:mem:plataformacreditodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  cloud:
    openfeign:
      client:
        config:
          coreBancarioClient:
            connect-timeout: 2000
            read-timeout: 3000

core:
  bancario:
    url: ${CORE_BANCARIO_URL:http://localhost:8080/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
